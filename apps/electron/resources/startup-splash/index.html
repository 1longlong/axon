<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Axon</title>
    <style>
      /* 原生启动页：不依赖 renderer bundle，冷启动期间显示 */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #101418;
        color: #e6e6e6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .center {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .logo {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .hint {
        font-size: 13px;
        opacity: 0.5;
      }
      .bar {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.55);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div class="center">
      <div class="logo">Axon</div>
      <div class="bar"></div>
      <div class="hint">正在启动…</div>
    </div>
  </body>
</html>
