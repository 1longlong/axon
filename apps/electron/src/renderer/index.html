<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axon</title>
    <script>
      // 主题初始化脚本（在 React 加载前执行，避免闪烁）
      // 在 React 加载前同步应用主题，避免首屏出现明暗闪烁
      ;(function() {
        var mode = localStorage.getItem('axon-theme-mode') || 'dark'
        var html = document.documentElement
        if (mode === 'dark') {
          html.classList.add('dark')
        } else if (mode === 'system') {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.classList.add('dark')
          }
        }
        // mode === 'light' 时不添加 dark 类
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
