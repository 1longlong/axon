appId: com.axon.desktop
productName: Axon

asar: true
asarUnpack:
  - dist/app-server.mjs
  - dist/axon-doc.mjs
  - dist/node_modules/**/*
  - node_modules/**/*
electronDist: node_modules/electron/dist

directories:
  output: release
  buildResources: resources

files:
  - dist/main.cjs
  - dist/app-server.mjs
  - dist/axon-doc.mjs
  - dist/node_modules/**/*
  - dist/preload.cjs
  - dist/THIRD_PARTY_NOTICES.md
  - dist/renderer/**/*
  - package.json

# Axon 打包后通过 process.resourcesPath 读取这些文件
extraResources:
  - from: dist/resources
    to: .

mac:
  category: public.app-category.developer-tools
  icon: resources/axon-icon.svg
  target:
    - dmg
    - zip

artifactName: ${productName}-${version}-${arch}.${ext}
